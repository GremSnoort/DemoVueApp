version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build: ./backend
    environment:
      APP_ENV: dev
      DB_DSN: postgres://app:app@db:5432/app?sslmode=disable
      JWT_SECRET: change_me_super_secret
      ADMIN_SEED_PASSWORD: Admin12345!
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

#  frontend:
#    build: ./frontend
#    ports:
#      - "5173:5173"
#    depends_on:
#      - backend

volumes:
  dbdata: {}

